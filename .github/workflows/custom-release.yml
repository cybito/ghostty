name: Custom release
on:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'cybito/ghostty' && !github.event.release.draft
    runs-on: ubuntu-26.04-arm
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable custom release source
        id: validate
        run: |
          git fetch --no-tags origin +refs/heads/custom:refs/remotes/origin/custom
          bash .github/scripts/custom-release.sh validate
      - name: Exercise release boundary and installer regressions
        run: bash .github/scripts/custom-release.sh regressions

  build:
    needs: validate
    permissions:
      contents: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-26
            zig_sha: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          - platform: linux
            runner: ubuntu-26.04-arm
            zig_sha: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: custom-release-${{ github.repository }}-${{ needs.validate.outputs.version }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
      ZIG_SHA: ${{ matrix.zig_sha }}
      NU_SHA: 302fb3dfc5d44e7fe0d5b8227be8e75b4c3956ca8d4804234e5c68fbdd3e4917
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check existing platform assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/existing" > "$RUNNER_TEMP/check.json"
          python3 - <<'PY'
          import json, os
          result = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'check.json')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('exists=' + str(result['exists']).lower() + '\n')
          PY
      - name: Install checksum-verified build tools
        if: steps.check.outputs.exists != 'true'
        env:
          INSTALL_BUILD_TOOLS: '1'
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/custom-release.sh tools "$PLATFORM"
      - name: Install Linux build and X11 smoke dependencies
        if: steps.check.outputs.exists != 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blueprint-compiler build-essential gettext libbz2-dev libonig-dev libxml2-utils pandoc libadwaita-1-dev libgtk-4-dev libgtk4-layer-shell-dev desktop-file-utils xvfb xauth dbus-x11 mesa-vulkan-drivers libgl1-mesa-dri imagemagick x11-utils tesseract-ocr
      - name: Build exact native ARM64 source
        if: steps.check.outputs.exists != 'true'
        run: bash .github/scripts/custom-release.sh build "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/build-output"
      - name: Package complete application resources
        if: steps.check.outputs.exists != 'true'
        run: python3 .github/scripts/package-release.py pack --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --input-dir "$RUNNER_TEMP/build-output" --output-dir "$RUNNER_TEMP/package"
      - name: Install fixture and prove native GUI window and screenshot
        id: smoke
        if: steps.check.outputs.exists != 'true'
        run: bash .github/scripts/custom-release.sh smoke "$PLATFORM" "$RELEASE_TAG" "$RUNNER_TEMP/package"
      - name: Upload smoke diagnostics
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.validate.outputs.version }}-${{ matrix.platform }}-arm64-smoke
          path: ${{ runner.temp }}/ghostty-smoke/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish product release assets
        if: steps.smoke.outcome == 'success' && steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package-release.py publish --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --directory "$RUNNER_TEMP/package" >> "$GITHUB_STEP_SUMMARY"

  summarize:
    needs: [validate, build]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    concurrency:
      group: custom-release-notes-${{ github.repository }}-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub assets and preserve user release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/custom-release.sh summarize
